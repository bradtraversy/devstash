<svg viewBox="0 0 1024 512" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
  <title id="title">DevStash logo</title>
  <desc id="description">A stack of three offset rounded cards beside the DevStash wordmark.</desc>
  <g id="icon" transform="translate(32 76) scale(0.703125)">
    <g id="stash">
      <rect x="64" y="168" width="280" height="280" rx="44" fill="#1D4ED8"/>
      <rect x="112" y="120" width="280" height="280" rx="44" fill="#3B82F6"/>
    </g>
    <g id="shareable-unit">
      <rect x="160" y="72" width="280" height="280" rx="44" fill="#60A5FA"/>
    </g>
  </g>
  <g id="wordmark">
    <text x="408" y="294" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-4">DevStash</text>
  </g>
</svg>
